<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>403 Forbidden — Road NextGen</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet"/>
  <style>
    body{font-family:'Inter',sans-serif;background:#f0f4f8;min-height:100vh;display:flex;align-items:center;justify-content:center;margin:0;color:#0f172a}
    .wrap{text-align:center;padding:40px;max-width:420px}
    .icon{font-size:80px;margin-bottom:16px}
    .code{font-size:80px;font-weight:800;color:#ef4444;line-height:1;margin-bottom:12px}
    h2{font-size:22px;font-weight:700;margin-bottom:8px}
    p{color:#64748b;font-size:14px;margin-bottom:28px;line-height:1.6}
    .btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
    a{display:inline-flex;align-items:center;gap:8px;padding:11px 22px;border-radius:9px;text-decoration:none;font-size:14px;font-weight:600}
    .primary{background:#1e40af;color:#fff}
    .secondary{background:#e2e8f0;color:#0f172a}
  </style>
</head>
<body>
<div class="wrap">
  <div class="icon">🚫</div>
  <div class="code">403</div>
  <h2>Access Forbidden</h2>
  <p>You don't have permission to view this page. Please make sure you're logged in with the correct role.</p>
  <div class="btns">
    <a href="/" class="primary">← Dashboard</a>
    <a href="/auth/login" class="secondary">Sign In</a>
  </div>
</div>
</body>
</html>
