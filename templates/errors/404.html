<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>404 Not Found — Road NextGen</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet"/>
  <style>
    body{font-family:'Inter',sans-serif;background:#f0f4f8;min-height:100vh;display:flex;align-items:center;justify-content:center;margin:0;color:#0f172a}
    .wrap{text-align:center;padding:40px;max-width:420px}
    .icon{font-size:80px;margin-bottom:16px}
    .code{font-size:80px;font-weight:800;color:#1e40af;line-height:1;margin-bottom:12px}
    h2{font-size:22px;font-weight:700;margin-bottom:8px}
    p{color:#64748b;font-size:14px;margin-bottom:28px;line-height:1.6}
    a{display:inline-flex;align-items:center;gap:8px;padding:11px 22px;border-radius:9px;text-decoration:none;font-size:14px;font-weight:600;background:#1e40af;color:#fff}
  </style>
</head>
<body>
<div class="wrap">
  <div class="icon">🛣️</div>
  <div class="code">404</div>
  <h2>Page Not Found</h2>
  <p>The page you're looking for doesn't exist or has been moved. Let's get you back on the right road.</p>
  <a href="/">← Back to Dashboard</a>
</div>
</body>
</html>
